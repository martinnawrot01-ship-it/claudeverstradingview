<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier d'images</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --text: #1f2421; --muted: #6b716d;
    --border: #e2ded5; --accent: #2f5d4a; --accent-text: #fff; --soft: #eef3f0; --warn: #9a5b13;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151816; --panel: #1e2320; --text: #e8ebe9; --muted: #9aa29d;
      --border: #303833; --accent: #6fb08f; --accent-text: #0f1411; --soft: #222b26; --warn: #e3a55a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 220px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .msg { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .msg.user { background: var(--soft); }
  .msg .who { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }
  .msg img.result { width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .note { color: var(--warn); font-size: .9rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button, .btn { border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-text); text-decoration: none; display: inline-block; }
  button.secondary, .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: wait; }
  textarea { width: 100%; resize: vertical; min-height: 56px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); padding: 10px 12px; font: inherit; }
  .composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); }
  .composer .inner { max-width: 820px; margin: 0 auto; padding: 12px 16px 16px; }
  .attach { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { position: relative; }
  .chip img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .chip button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%;
    font-size: 13px; line-height: 22px; background: var(--text); color: var(--bg); }
  .composer .row { margin-top: 8px; align-items: center; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  details pre { white-space: pre-wrap; font-size: .85rem; background: var(--soft); padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Atelier d'images</h1>
  <p class="sub">Décris ce que tu veux et joins tes photos. L'IA analyse ta demande, pose une question si quelque chose n'est pas clair, génère l'image puis vérifie qu'elle correspond.</p>
  <div id="chat"></div>
</main>

<div class="composer"><div class="inner">
  <div class="attach" id="attach"></div>
  <textarea id="prompt" placeholder="Ex : crée une cuisine ouverte sur le mur blanc à droite de la photo"></textarea>
  <div class="row">
    <label class="btn secondary" for="file">+ Images</label>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    <span style="flex:1"></span>
    <button class="secondary" id="reset" title="Nouvelle conversation">Nouveau</button>
    <button id="send">Envoyer</button>
  </div>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat");
let attachments = [];   // [{blob, url, label}]
let history = [];       // [{request, understanding}]
let busy = false;

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderAttach() {
  $("#attach").innerHTML = "";
  attachments.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "chip";
    d.innerHTML = `<img src="${a.url}" title="${esc(a.label)}"><button aria-label="Retirer">×</button>`;
    d.querySelector("button").onclick = () => { attachments.splice(i, 1); renderAttach(); };
    $("#attach").appendChild(d);
  });
}

function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    attachments.push({ blob: f, url: URL.createObjectURL(f), label: f.name });
  }
  renderAttach();
}
$("#file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
document.addEventListener("paste", (e) => addFiles([...e.clipboardData.files]));
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); addFiles(e.dataTransfer.files); });

function bubble(html, cls = "") {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return d;
}

function formData(extra) {
  const fd = new FormData();
  attachments.forEach((a) => fd.append("images", a.blob, a.label));
  fd.append("labels", JSON.stringify(attachments.map((a) => a.label)));
  fd.append("history", JSON.stringify(history));
  for (const [k, v] of Object.entries(extra)) fd.append(k, typeof v === "string" ? v : JSON.stringify(v));
  return fd;
}

async function post(url, fd) {
  const r = await fetch(url, { method: "POST", body: fd });
  const j = await r.json().catch(() => ({ error: "Réponse invalide du serveur" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function setBusy(b) { busy = b; $("#send").disabled = b; }

async function send() {
  const prompt = $("#prompt").value.trim();
  if (!prompt || busy) return;
  $("#prompt").value = "";
  bubble(`<div class="who">Toi</div>${esc(prompt)}<div class="thumbs">${attachments.map((a) => `<img src="${a.url}">`).join("")}</div>`, "user");
  await runPlan(prompt, "");
}

async function runPlan(prompt, answers) {
  setBusy(true);
  const wait = bubble(`<span class="spinner"></span>J'analyse ta demande et tes images…`);
  try {
    const plan = await post("/api/plan", formData({ prompt, answers }));
    wait.remove();
    showPlan(prompt, plan, answers);
  } catch (e) {
    wait.innerHTML = `<span class="note">Erreur : ${esc(e.message)}</span>`;
    setBusy(false);
  }
}

function showPlan(prompt, plan, answers) {
  const assumptions = plan.assumptions.length ? `<div class="muted" style="margin-top:6px">Choix faits pour toi :</div><ul>${plan.assumptions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : "";
  if (plan.questions.length) {
    const d = bubble(`<div class="who">Ce que j'ai compris</div>${esc(plan.understanding)}${assumptions}
      <div style="margin-top:10px"><strong>Avant de générer, j'ai besoin de préciser :</strong></div>
      <ul>${plan.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>
      <textarea placeholder="Tes réponses…"></textarea>
      <div class="row"><button class="answer">Répondre</button><button class="secondary skip">Générer quand même</button></div>`);
    d.querySelector(".answer").onclick = () => {
      const a = d.querySelector("textarea").value.trim();
      if (!a) return;
      d.querySelector(".row").remove();
      runPlan(prompt, [answers, a].filter(Boolean).join("\n"));
    };
    d.querySelector(".skip").onclick = () => { d.querySelector(".row").remove(); runGenerate(prompt, plan); };
    setBusy(false);
    return;
  }
  bubble(`<div class="who">Ce que j'ai compris</div>${esc(plan.understanding)}${assumptions}
    <details><summary>Consigne envoyée au générateur</summary><pre>${esc(plan.image_prompt)}</pre></details>`);
  runGenerate(prompt, plan);
}

async function runGenerate(prompt, plan) {
  setBusy(true);
  const wait = bubble(`<span class="spinner"></span>Je génère l'image puis je vérifie le résultat… (30 s à 2 min)`);
  try {
    const out = await post("/api/generate", formData({ prompt, plan }));
    wait.remove();
    const src = `data:${out.image.mimeType};base64,${out.image.data}`;
    const last = out.attempts[out.attempts.length - 1];
    const retried = out.attempts.length > 1 ? `<div class="muted">Première version corrigée automatiquement (${esc(out.attempts[0].issues.join(" ; "))}).</div>` : "";
    const issues = !last.ok && last.issues.length ? `<div class="note">Points encore imparfaits : ${esc(last.issues.join(" ; "))}. Tu peux demander une correction.</div>` : "";
    const d = bubble(`<div class="who">Résultat</div>${retried}${issues}<img class="result" src="${src}">
      <div class="row"><a class="btn secondary" download="image-${Date.now()}.png" href="${src}">Télécharger</a>
      <button class="continue">Continuer à modifier cette image</button></div>`);
    history.push({ request: prompt, understanding: plan.understanding });
    d.querySelector(".continue").onclick = async () => {
      const blob = await (await fetch(src)).blob();
      attachments = [{ blob, url: URL.createObjectURL(blob), label: "dernier résultat" }];
      renderAttach();
      $("#prompt").focus();
    };
    d.querySelector(".continue").click();
  } catch (e) {
    wait.innerHTML = `<span class="note">Erreur : ${esc(e.message)}</span>`;
  }
  setBusy(false);
}

$("#send").onclick = send;
$("#prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#reset").onclick = () => { history = []; attachments = []; renderAttach(); chat.innerHTML = ""; };
</script>
</body>
</html>
